<poe-tool-page [pips]="[true, true, false]" [heading]="'Defense Calculator'" [subtitle]="'Armor · Energy Shield · Evasion'">
  <poe-card [maxWidth]="'520px'">
    <div class="mode-toggle">
      <label class="mode-label">
        <input
          type="radio"
          name="def-mode"
          value="base"
          [checked]="mode() === 'base'"
          (change)="mode.set('base')"
        />
        <span class="mode-tab">Direct Value</span>
      </label>
      <label class="mode-label">
        <input
          type="radio"
          name="def-mode"
          value="percent"
          [checked]="mode() === 'percent'"
          (change)="mode.set('percent')"
        />
        <span class="mode-tab">% From Range</span>
      </label>
    </div>

    @if (mode() === 'base') {
      <div>
        <div class="section-label">Base</div>
        <div class="poe-field">
          <div class="poe-field-label">Base Value</div>
          <input type="number" [ngModel]="base()" (ngModelChange)="base.set($event)" />
        </div>
      </div>
    }

    @if (mode() === 'percent') {
      <div>
        <div class="section-label">Range</div>
        <div class="fields-grid-2">
          <div class="poe-field">
            <div class="poe-field-label">Min (0%)</div>
            <input type="number" [ngModel]="rangeMin()" (ngModelChange)="rangeMin.set($event)" />
          </div>
          <div class="poe-field">
            <div class="poe-field-label">Max (100%)</div>
            <input type="number" [ngModel]="rangeMax()" (ngModelChange)="rangeMax.set($event)" />
          </div>
        </div>
        <div class="poe-field">
          <div class="poe-field-label">Roll — <span>{{ pctLabel() }}</span>%</div>
          <input
            type="number"
            [ngModel]="rangePercent()"
            (ngModelChange)="rangePercent.set($event)"
          />
          <div class="range-slider-wrap">
            <input type="range" min="0" max="100" [value]="sliderValue()" (input)="onSlider($event)" />
            <div class="range-labels"><span>0%</span><span>50%</span><span>100%</span></div>
          </div>
        </div>
      </div>
    }

    <div class="poe-divider">
      <div class="poe-divider-line"></div>
      <div class="poe-diamond"></div>
      <div class="poe-divider-line"></div>
    </div>

    <div class="section-label">Modifiers</div>
    <div class="fields-grid-2">
      <div class="poe-field">
        <div class="poe-field-label">Flat Addition</div>
        <input type="number" [ngModel]="flat()" (ngModelChange)="flat.set($event)" />
      </div>
      <div class="poe-field">
        <div class="poe-field-label">Increased %</div>
        <input type="number" [ngModel]="inc()" (ngModelChange)="inc.set($event)" />
      </div>
    </div>
    <div class="poe-field">
      <div class="poe-field-label">Quality %</div>
      <input type="number" [ngModel]="quality()" (ngModelChange)="quality.set($event)" />
    </div>

    <div class="result-box">
      <div class="result-label">Final Value</div>
      <div class="result-value" #resultEl>{{ result() }}</div>
    </div>
  </poe-card>
</poe-tool-page>
