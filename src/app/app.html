<aside class="sidebar" [class.open]="sidebarOpen()">
  <div class="sidebar-logo">
    <span class="sidebar-title">POE TOOLS</span>
  </div>
  <nav class="sidebar-nav">
    @for (tool of tools; track tool.id) {
      <a
        class="nav-btn"
        [routerLink]="['/', tool.id]"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <svg
          class="nav-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          [innerHTML]="icon(tool)"
        ></svg>
        <span>{{ tool.label }}</span>
      </a>
    }
  </nav>
  <div class="sidebar-footer">
    <!-- Held back until the session check answers, so a link that turns out to
         have no backend behind it is never shown and then taken away. -->
    @if (auth.ready() && auth.available()) {
      <a class="sidebar-account" routerLink="/account" routerLinkActive="active" (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
        </svg>
        <span>{{ auth.user()?.email ?? 'Sign in' }}</span>
      </a>
    }
    <div class="sidebar-footer-gems">
      <div class="footer-gem gem-red"></div>
      <div class="footer-gem gem-green"></div>
      <div class="footer-gem gem-blue"></div>
    </div>
  </div>
</aside>

<div class="sidebar-overlay" [class.visible]="sidebarOpen()" (click)="closeSidebar()"></div>

<div class="app-content">
  <header class="mobile-header">
    <button class="menu-toggle" (click)="openSidebar()" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12h18M3 6h18M3 18h18" />
      </svg>
    </button>
    <span class="mobile-title">POE TOOLS</span>
  </header>

  <router-outlet />
</div>
